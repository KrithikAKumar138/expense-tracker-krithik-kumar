<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Expense Tracker - Categories
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div class="app-container">


    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">₹</div>

            <span>
                Expense Tracker
            </span>

        </div>


        <nav class="sidebar-nav">

            <a
                href="index.html"
                class="nav-item"
            >
                <span class="nav-icon">▣</span>
                <span>Dashboard</span>
            </a>


            <a
                href="transactions.html"
                class="nav-item"
            >
                <span class="nav-icon">☷</span>
                <span>Transactions</span>
            </a>


            <a
                href="add-transaction.html"
                class="nav-item"
            >
                <span class="nav-icon">＋</span>
                <span>Add Transaction</span>
            </a>


            <a
                href="categories.html"
                class="nav-item"
            >
                <span class="nav-icon">◈</span>
                <span>Categories</span>
            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="dark-mode-row">

                <span>Dark Mode</span>

                <button
                    type="button"
                    class="theme-switch"
                    id="darkModeToggle"
                >
                    <span></span>
                </button>

            </div>

        </div>

    </aside>




    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>
                    Categories
                </h1>

                <p>
                    View your spending categories
                </p>

            </div>


            <a
                href="add-transaction.html"
                class="primary-button"
            >
                + Add Transaction
            </a>

        </header>



        <section class="categories-section">

            <div
                id="categoryGrid"
                class="category-grid"
            ></div>

        </section>

    </main>

</div>


<script src="js/app.js"></script>

</body>
</html>
